<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Bodyweight training with skill progressions, set logging and a rest timer.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Calisthenics</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <div id="overlay" hidden></div>
  <div id="toast" role="status"></div>
  <nav aria-label="Main">
    <button data-action="tab" data-tab="suggest"><span aria-hidden="true">✨</span>Surprise me!</button>
    <button data-action="tab" data-tab="create"><span aria-hidden="true">🛠️</span>Create</button>
    <button data-action="tab" data-tab="history"><span aria-hidden="true">🗓️</span>History</button>
    <button data-action="tab" data-tab="progress"><span aria-hidden="true">📈</span>Progress</button>
    <button data-action="tab" data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
